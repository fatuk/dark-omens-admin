# Render Blueprint — админка-CMS Dark Omens (статичный SPA на Vite).
#
# Деплой:
#   1. Запушить этот каталог в GitHub-репозиторий.
#   2. Render → New → Blueprint → выбрать репозиторий.
#   3. Render прочитает render.yaml, соберёт dist/ и раздаст как статику + CDN.
#
# Почему static, а не node: аппа целиком клиентская (ни SSR, ни серверных
# секретов) — ходит в relay прямо из браузера, admin-key вводится в шапке.
# Тариф static на Render бесплатный, без cold-start.
services:
  - type: web
    name: dark-omens-admin
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA-роутинг: любой путь (например /edit/<id> при hard-refresh) отдаёт
    # index.html, дальше роутит react-router на клиенте.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Заголовки безопасности. Главный риск панели — XSS: в localStorage лежит
    # admin-key, и любой чужой скрипт на странице его утащит. CSP запрещает
    # сторонние скрипты и инлайн-JS; connect-src широкий (https:), потому что
    # API base переопределяется в шапке; 'unsafe-inline' у style — для inline-
    # стилей React Flow/React. frame-ancestors 'none' + X-Frame-Options: панель
    # не должна открываться во фрейме чужого сайта (clickjacking).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      # Дефолтный URL relay, зашивается в бандл на этапе сборки (build-time).
      # Не секрет (публичный URL). В шапке его всё ещё можно переопределить
      # (поле «API base» → localStorage). Поменяешь здесь → нужен redeploy.
      - key: VITE_API_BASE
        value: https://dark-omens-backend.onrender.com
